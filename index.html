<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Student profile directory for the GitHub Pages activity.">
  <title>Student Profiles</title>
  <style>
    :root {
      --ink: #171815;
      --paper: #f2f1ec;
      --muted: #6e7069;
      --line: rgba(23, 24, 21, .16);
      --accent: #c8f36a;
      --accent-dark: #263309;
      --max-width: 1180px;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: min(calc(100% - 48px), var(--max-width));
      margin: 0 auto;
      padding: 28px 0 56px;
    }

    .masthead {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .hero {
      max-width: 820px;
      padding: 112px 0 96px;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 820px;
      margin: 0 0 24px;
      font-size: clamp(3.8rem, 10vw, 9rem);
      font-weight: 800;
      letter-spacing: -.095em;
      line-height: .83;
    }

    .intro {
      max-width: 510px;
      margin: 0;
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1.5;
    }

    .directory {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: end;
      padding: 26px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .directory h2 {
      margin: 0 0 8px;
      font-size: 1.5rem;
      letter-spacing: -.04em;
    }

    .directory p {
      margin: 0;
      color: var(--muted);
      font-size: .9rem;
    }

    .profile-link {
      display: inline-flex;
      align-items: center;
      min-height: 46px;
      padding: 10px 18px;
      background: var(--ink);
      color: var(--paper);
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-decoration: none;
      text-transform: uppercase;
      transition: transform .2s ease, background .2s ease, color .2s ease;
    }

    .profile-link:hover,
    .profile-link:focus-visible {
      transform: translateY(-2px);
      background: var(--accent);
      color: var(--accent-dark);
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      padding-top: 20px;
      color: var(--muted);
      font-size: .75rem;
    }

    footer p { margin: 0; }

    @media (max-width: 640px) {
      .page { width: min(calc(100% - 32px), var(--max-width)); padding-top: 18px; }
      .hero { padding: 88px 0 72px; }
      h1 { font-size: clamp(3.5rem, 19vw, 6.5rem); }
      .directory { grid-template-columns: 1fr; }
      footer { flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      .profile-link { transition: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <span>Online Activity #3</span>
      <span>GitHub / Profiles</span>
    </header>

    <main>
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">Student profile directory</p>
        <h1 id="page-title">People who build.</h1>
        <p class="intro">A collection of student pages for the GitHub fork, update and pull request activity.</p>
      </section>

      <section class="directory" aria-labelledby="directory-heading">
        <div>
          <h2 id="directory-heading"><a href="202306334.html">Julian Charles Macato</a></h2>
          <p>202306334 · Bachelor of Science in Information Technology</p>
        </div>
        <a class="profile-link" href="202306334.html">View profile ↗</a>
      </section>
    </main>

    <footer>
      <p>Profile directory</p>
      <p>2026</p>
    </footer>
  </div>
</body>
</html>
